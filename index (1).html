<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회귀챗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}
/* Layout: 한 화면 채팅. 위 머리말, 가운데 대화(스크롤), 아래 예시 질문과 입력창 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#17202b; --muted:#5b6876; --line:#d9dfe6; --me:#2f6db5; --me-fg:#ffffff;
  --lin:#2f6db5; --poly:#c27a12; --pow:#b8336a; --exp:#2e8b6f; --ann:#6b4fb3; --warn:#b4471c;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#18202a; --fg:#e4e9ef; --muted:#93a0ae; --line:#2a3542; --me:#3f7fca; --me-fg:#ffffff;
  --lin:#6ea3e6; --poly:#e0a23f; --pow:#e9729f; --exp:#55c19e; --ann:#a892f0; --warn:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#18202a; --fg:#e4e9ef; --muted:#93a0ae; --line:#2a3542; --me:#3f7fca; --me-fg:#ffffff;
  --lin:#6ea3e6; --poly:#e0a23f; --pow:#e9729f; --exp:#55c19e; --ann:#a892f0; --warn:#f08a5d; color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.app{height:100%;max-width:820px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column}
header{padding:18px 0 12px;border-bottom:1px solid var(--line)}
header h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
header p{margin:.2rem 0 0;color:var(--muted);font-size:.88rem;max-width:65ch}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;min-width:0}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-fg);border-radius:14px 14px 4px 14px;padding:8px 14px;max-width:85%;overflow-wrap:anywhere}
.msg.bot{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;display:grid;gap:10px}
.tag{font-size:.75rem;letter-spacing:.04em;color:var(--muted);font-weight:500}
.q{font-weight:500}
.big{font:500 1.5rem var(--mono);font-variant-numeric:tabular-nums}
.big small{font:400 .85rem var(--sans);color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-size:.75rem;letter-spacing:.05em;color:var(--muted);font-weight:500}
td{font-family:var(--mono)}
td:first-child{font-family:var(--sans)}
tr.base td{color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.pill{display:inline-block;font:500 .72rem var(--sans);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:8px;color:var(--muted)}
.eq{font:400 .82rem var(--mono);color:var(--muted);overflow-wrap:anywhere;margin:2px 0 0}
.note{color:var(--muted);font-size:.85rem;margin:0}
.warn{color:var(--warn);font-size:.85rem;margin:0}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:500 .85rem var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button:hover{border-color:var(--me)}
@media (max-width:560px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips button{flex:none}}
footer{padding:10px 0 16px;display:grid;gap:10px;border-top:1px solid var(--line)}
form{display:flex;gap:8px}
#q{flex:1;min-width:0;font:400 1rem var(--sans);padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
#send{font:500 1rem var(--sans);padding:10px 18px;border:none;border-radius:10px;background:var(--me);color:var(--me-fg);cursor:pointer}
#q:focus-visible,#send:focus-visible,.chips button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>회귀챗</h1>
    <p>선형회귀, 비선형회귀, 인공신경망에게 문장으로 질문합니다. 열 이름과 숫자를 찾아 답하는 규칙 기반 챗봇이며, 아래 데이터에 관한 질문에만 답합니다.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <footer>
    <div class="chips" id="chips"></div>
    <form id="form" autocomplete="off">
      <input id="q" type="text" placeholder="예: 키 175면 몸무게는?" aria-label="질문">
      <button id="send" type="submit">보내기</button>
    </form>
  </footer>
</div>

const NUM_RE = /(?<![0-9a-z.])-?\d+(?:\.\d+)?/g;
const MAX_GAP = 10;
const KEYWORDS = {
  help: ["도움", "사용법", "help", "할 수 있", "기능", "예시", "안녕", "hello"],
  compare: ["비교", "성능", "정확", "어떤 모델", "어느 모델", "제일 좋", "가장 좋", "최고", "r2", "r²", "rmse", "mae", "오차", "결과"],

  stats: ["평균", "최소", "최대", "최솟값", "최댓값", "범위", "표준편차"],
  data: ["데이터", "자료", "표본", "몇 명", "몇명", "몇 개", "몇개", "변수", "특성", "목록", "입력"],
};
const EQ_WORD_RE = /(?<![가-힣])식(?![가-힣]{2,})/;
const MODEL_WORDS = {"선형회귀": ["선형"], "비선형(2차 다항)": ["다항", "2차"], "비선형(거듭제곱)": ["거듭제곱"],
                     "비선형(지수)": ["지수"], "인공신경망": ["신경망", "ann", "mlp"]};
const COLOR = {lin: "var(--lin)", poly: "var(--poly)", pow: "var(--pow)", exp: "var(--exp)", mlp: "var(--ann)"};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const g = v => Number.isFinite(v) ? String(parseFloat(v.toPrecision(4))) : "–";
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

// ── 모델 계산 ──
function predictOne(m, x) {
  if (m.kind === "lin") return m.b0 + dot(m.b, x);
  if (m.kind === "poly") return m.c0 + dot(m.c1, x) + dot(m.c2, x.map(v => v * v));
  if (m.kind === "pow") return x.some(v => v <= 0) ? NaN : m.a * x.reduce((p, v, i) => p * Math.pow(v, m.b[i]), 1);
  if (m.kind === "exp") return m.a * Math.exp(dot(m.b, x));
  let a = x.map((v, i) => (v - m.xm[i]) / m.xs[i]);          // 인공신경망 순전파
  m.W.forEach((W, l) => {
    const out = m.B[l].map((b, j) => b + a.reduce((s, v, i) => s + v * W[i][j], 0));
    a = l === m.W.length - 1 ? out : out.map(v => Math.max(0, v));
  });
  return a[0] * m.ys + m.ym;
}

// ── 질문 이해 ──
function findColumns(ds, text) {
  let masked = text; const hits = [];
  for (const [alias, col] of ds.aliases) {
    let start = 0, i;
    while ((i = masked.indexOf(alias, start)) !== -1) {
      const j = i + alias.length; start = j;
      const before = i ? masked[i - 1] : "", after = masked[j] || "";
      if (/^[\x00-\x7f]*$/.test(alias) && (/[a-z0-9]/.test(before) || /[a-z0-9]/.test(after))) continue;
      if (alias.length === 1 && /[가-힣]/.test(before)) continue;
      hits.push([i, j, col]);
      masked = masked.slice(0, i) + " ".repeat(alias.length) + masked.slice(j);
    }
  }
  hits.sort((a, b) => a[0] - b[0]);
  return [hits, masked];
}

let last = DATA[0];
function route(text) {
  let best = null, bestScore = 0; const parsed = new Map();
  for (const ds of [last, ...DATA.filter(d => d !== last)]) {
    const [hits, masked] = findColumns(ds, text);
    parsed.set(ds, [hits, masked]);
    const score = hits.length + ds.keywords.filter(k => text.includes(k)).length;
    if (score > bestScore) { best = ds; bestScore = score; }
  }
  const ds = best || last;
  return [ds, ...parsed.get(ds), best !== null];
}

function answer(raw) {
  raw = raw.trim();
  if (!raw) return help();
  if (raw.startsWith("/load"))
    return `<p class="note">웹 화면에서는 미리 학습된 두 데이터만 답합니다. 다른 표 데이터는 저장소의 파이썬 버전에서 <span class="eq">python chat.py --data 파일.csv --target 열이름</span> 으로 학습할 수 있습니다.</p>`;
  const text = raw.toLowerCase();
  let [ds, hits, masked, explicit] = route(text);
  last = ds;
  for (const words of Object.values(MODEL_WORDS))
    for (const w of words) masked = masked.split(w).join(" ".repeat(w.length));
  const numbers = [...masked.matchAll(NUM_RE)].map(m => [m.index, parseFloat(m[0])]);

  const values = {}, used = new Set();
  hits.forEach(([s, e, col], k) => {
    const nxt = k + 1 < hits.length ? hits[k + 1][0] : masked.length;
    for (const [pos, v] of numbers)
      if (e <= pos && pos < nxt && pos - e <= MAX_GAP && !used.has(pos) && !(col in values)) { values[col] = v; used.add(pos); }
  });
  const free = numbers.filter(([pos]) => !used.has(pos)).map(([, v]) => v);
  const mentioned = hits.map(h => h[2]);
  let intent = Object.keys(KEYWORDS).find(name => KEYWORDS[name].some(k => masked.includes(k))) || null;
  if (!intent && EQ_WORD_RE.test(masked)) intent = "equation";

  if (ds.target in values && !ds.features.some(c => c in values))
    return tag(ds) + `<p class="note">이 모델은 입력(${esc(ds.features.map(c => ds.label[c]).join(", "))}) → 출력(${esc(ds.label[ds.target])}) 방향으로만 학습되어 있어, ${esc(ds.label[ds.target])} 값으로 입력을 거꾸로 맞히는 질문에는 답할 수 없습니다.</p>`;
  delete values[ds.target];
  if (Object.keys(values).length) return predict(ds, values);
  if (intent === "help") return help();
  if (intent === "compare") return compare(ds);
  if (intent === "equation") return equation(ds, text);
  if (intent === "stats") return stats(ds, mentioned);
  if (intent === "data") return dataInfo(explicit ? ds : null);
  for (const d of explicit ? [ds] : [ds, ...DATA.filter(x => x !== ds)])
    if (free.length === d.features.length) {
      last = d;
      return predict(d, Object.fromEntries(d.features.map((c, i) => [c, free[i]])));
    }
  if (mentioned.length) return stats(ds, mentioned);
  return `<p class="note">질문을 이해하지 못했습니다.</p>` + help();
}

// ── 답변 ──
const tag = ds => `<div class="tag">${esc(ds.title)} 데이터</div>`;
const withUnit = (ds, col, v, d = 1) => v.toFixed(d) + (ds.unit[col] ? " " + ds.unit[col] : "");
const sw = m => `<span class="sw" style="background:${COLOR[m.kind]}"></span>`;

function predict(ds, values) {
  const x = ds.features.map(c => c in values ? values[c] : ds.fill[c]);
  const t = ds.target;
  const given = Object.entries(values).map(([c, v]) => `${ds.label[c]} ${g(v)}${ds.unit[c]}`).join(", ");
  let rows = "", best = NaN;
  for (const m of ds.models) {
    const p = predictOne(m, x);
    if (m.name === ds.best) best = p;
    rows += `<tr><td>${sw(m)}${esc(m.name)}${m.name === ds.best ? '<span class="pill">검증 오차 최소</span>' : ""}</td>` +
            `<td>${Number.isFinite(p) ? esc(withUnit(ds, t, p)) : "계산 불가"}</td></tr>`;
  }
  let html = tag(ds) + `<div class="q">${esc(given)} → 예측 ${esc(ds.label[t])}</div>`;
  if (Number.isFinite(best))
    html += `<div class="big">약 ${esc(withUnit(ds, t, best))} <small>${esc(ds.best)} 기준, 테스트 오차 RMSE ${esc(withUnit(ds, t, ds.metrics[ds.best].rmse))}</small></div>`;
  html += `<div class="tbl"><table><thead><tr><th>모델</th><th>예측 ${esc(ds.label[t])}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  const missing = ds.features.filter(c => !(c in values));
  if (missing.length)
    html += `<p class="note">입력하지 않은 값은 데이터 평균(값이 두 종류뿐인 열은 더 많은 쪽)으로 채웠습니다: ${esc(missing.map(c => `${ds.label[c]} ${g(ds.fill[c])}`).join(", "))}</p>`;
  const out = Object.entries(values).filter(([c, v]) => v < ds.stats[c].min || v > ds.stats[c].max)
    .map(([c, v]) => `${ds.label[c]} ${g(v)} (데이터 범위 ${g(ds.stats[c].min)}~${g(ds.stats[c].max)})`);
  if (out.length) html += `<p class="warn">주의: 학습 데이터 범위 밖이라 예측을 믿기 어렵습니다: ${esc(out.join(", "))}</p>`;
  return html;
}

function compare(ds) {
  const [tr, va, te] = ds.sizes;
  let rows = "";
  for (const name of ds.metricOrder) {
    const k = ds.metrics[name], m = ds.models.find(x => x.name === name);
    rows += `<tr${m ? "" : ' class="base"'}><td>${m ? sw(m) : ""}${esc(name)}${name === ds.best ? '<span class="pill">검증 오차 최소</span>' : ""}</td>` +
            `<td>${k.mae.toFixed(2)}</td><td>${k.rmse.toFixed(2)}</td><td>${k.r2.toFixed(3)}</td></tr>`;
  }
  let html = tag(ds) + `<div class="q">테스트 데이터 ${te}${esc(ds.unitWord)} 기준 성능</div>` +
    `<div class="tbl"><table><thead><tr><th>모델</th><th>MAE</th><th>RMSE</th><th>R²</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  for (const [name, why] of Object.entries(ds.skipped)) html += `<p class="note">${esc(name)}: 건너뜀 (${esc(why)})</p>`;
  html += `<p class="note">학습 ${tr} / 검증 ${va} / 테스트 ${te}. 예측의 대표값은 검증 오차가 가장 작은 ${esc(ds.best)}입니다. 테스트 데이터가 적어 모델 간 작은 차이는 분할에 따라 뒤바뀔 수 있습니다.</p>`;
  return html;
}

function equation(ds, text) {
  let want = Object.keys(MODEL_WORDS).filter(n => MODEL_WORDS[n].some(w => text.includes(w)) &&
    !(n === "선형회귀" && text.includes("비선형") && text.split("선형").length - 1 === 1));
  if (text.includes("비선형")) want = want.concat(ds.models.map(m => m.name).filter(n => n.startsWith("비선형")));
  const items = ds.models.filter(m => !want.length || want.includes(m.name))
    .map(m => `<li><div>${sw(m)}${esc(m.name)}</div><p class="eq">${esc(m.equation)}</p></li>`).join("");
  return tag(ds) + `<div class="q">y = ${esc(ds.label[ds.target])}</div><ul class="plain">${items}</ul>`;
}

function stats(ds, cols) {
  cols = [...new Set(cols)];
  if (!cols.length) cols = [...ds.features, ds.target];
  const rows = cols.map(c => { const s = ds.stats[c];
    return `<tr><td>${esc(ds.label[c])}${ds.unit[c] ? ` (${esc(ds.unit[c])})` : ""}</td><td>${g(s.mean)}</td><td>${g(s.std)}</td><td>${g(s.min)}</td><td>${g(s.max)}</td></tr>`; }).join("");
  return tag(ds) + `<div class="q">${ds.n}${esc(ds.unitWord)}의 통계</div>` +
    `<div class="tbl"><table><thead><tr><th>열</th><th>평균</th><th>표준편차</th><th>최소</th><th>최대</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function dataInfo(ds) {
  return (ds ? [ds] : DATA).map(d => tag(d) +
    `<ul class="plain"><li>${esc(d.file)}, ${d.n}${esc(d.unitWord)}</li>` +
    `<li>입력: ${esc(d.features.map(c => d.label[c].includes(c) || c.includes(d.label[c]) ? d.label[c] : `${d.label[c]}(${c})`).join(", "))}</li>` +
    `<li>목표: ${esc(d.label[d.target])}</li><li>학습된 모델: ${esc(d.models.map(m => m.name).join(", "))}</li></ul>`).join("");
}

function examples() {
  return [...DATA.map(d => d.example), "어떤 모델이 제일 정확해?", "회귀식 알려줘", "신경망 구조는?", "평균이랑 범위 알려줘", "어떤 데이터가 있어?"];
}
function help() {
  return `<div class="q">이렇게 물어보세요</div><ul class="plain">${examples().map(e => `<li>${esc(e)}</li>`).join("")}</ul>` +
    `<p class="note">열 이름과 숫자를 함께 쓰면 예측합니다. 값을 일부만 줘도 되고, 열 순서대로 숫자만 써도 됩니다.</p>`;
}

// ── 화면 ──
const log = document.getElementById("log"), input = document.getElementById("q");
function add(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls; el.innerHTML = html; log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function ask(text) {
  if (!text.trim()) return;
  add("me", esc(text));
  let html;
  try { html = answer(text); } catch (e) { html = `<p class="warn">답을 계산하다 오류가 났습니다: ${esc(e.message)}</p>`; }
  add("bot", html);
}
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); input.value = ""; input.focus(); });
const chips = document.getElementById("chips");
for (const ex of examples()) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = ex; b.addEventListener("click", () => ask(ex));
  chips.appendChild(b);
}
if (DATA.length) {
  add("bot", `<div class="q">선형회귀, 비선형회귀, 인공신경망을 한 번에 학습해 두었습니다.</div>` + dataInfo(null));
  ask(DATA[DATA.length - 1].example);
} else {
  add("bot", `<p class="warn">학습 결과가 들어 있지 않습니다. 저장소에서 python export_web.py 를 실행해 주세요.</p>`);
}
</script>
